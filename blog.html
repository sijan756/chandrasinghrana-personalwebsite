---
layout: default
title: Blogs
---

<section id="blogs">
  <div class="container">
    <h2>All Blogs</h2>
    <ul>
      {% for post in site.posts %}
        <li>
          <a href="{{ post.url }}">{{ post.title }}</a> - {{ post.date | date: "%B %d, %Y" }}
        </li>
      {% endfor %}
    </ul>
  </div>
</section>
